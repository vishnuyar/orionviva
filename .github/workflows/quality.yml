name: Quality

on:
  push:
  pull_request:

# Neither job writes anything back to the repository.
permissions:
  contents: read

jobs:
  surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The impact gate measures a change against the commit before the
          # tip. With only that tip fetched there is no such commit, and the
          # gate falls back to comparing the tree against itself.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install product development dependencies
        run: python -m pip install -e core -e merchant -e product[dev]
      - name: Check surface contract artifact
        run: PYTHONPATH=.:product:core:merchant python scripts/check_surface_contract.py --check
      - name: Check surface impact gate
        run: PYTHONPATH=.:product:core:merchant python scripts/check_surface_impact.py --check
      - name: Run surface contract and boundary tests
        run: PYTHONPATH=.:product:core:merchant pytest product/tests/test_surface_contract.py product/tests/test_surface_capability_coverage.py product/tests/test_surface_gate_scripts.py product/tests/test_surface_import_boundaries.py product/viva/surface/test_contracts.py

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install every package with its development dependencies
        run: python -m pip install -e core -e merchant -e product[dev] -e bench[dev]
      - name: Run every package suite
        run: PYTHONPATH=.:product:core:merchant:bench python -m pytest product core merchant bench -q

      # The half of the honesty harness that needs no model, no vault and no
      # passphrase, over a frozen record of recorded turns. It runs on every
      # change rather than on a schedule, which is what PROG-27 asks for; the
      # half that calls a model cannot run here, because a key is a secret this
      # job is not given and a run without one would report nothing while
      # looking like a pass.
      - name: Run the honesty harness over the frozen turn record
        run: >-
          PYTHONPATH=.:product:core:merchant python -m viva.honesty
          --events product/evals/honesty_turns.json
          --max-unsupported-rate 0.0

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install product and sidecar build dependencies
        run: python -m pip install -e ../core -e ../merchant -e ../product -r ../product/requirements-sidecar-build.txt
      - run: npm ci
      - name: Check frontend architecture boundaries
        run: npm run check:architecture
      - run: npm run check:styles
      - run: npm test
      - run: npm run build
      - name: Build desktop sidecar
        run: |
          python ../scripts/build_desktop_sidecar.py \
            --output-dir src-tauri/binaries \
            --target "$(rustc -vV | sed -n 's/^host: //p')"

      # The one check in this repository whose subject is the artifact rather
      # than the tree. It starts the executable that was just built, speaks the
      # real protocol to it, opens the sample vault through it and reads every
      # surface — because a build that imports cleanly and cannot answer a frame
      # is exactly the build a person downloads.
      - name: Validate the packaged sidecar by running it
        run: |
          python ../scripts/validate_packaged_artifact.py \
            --target "$(rustc -vV | sed -n 's/^host: //p')"
      - name: Build Tauri desktop bundle
        run: npx tauri build

  showcase:
    # The denylist is a list of the exact strings that must not appear in this
    # repository, so it cannot live in this repository. It arrives as a secret,
    # is written to a file outside the tree, and is deleted whether the scan
    # passes or fails.
    #
    # Skipped rather than faked for a pull request from a fork, which cannot be
    # given secrets: a run that quietly reports clean without a pattern list is
    # the failure this job exists to end, so the script exits non-zero when it
    # is handed nothing and the job is not run at all when there is nothing to
    # hand it.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Scan every tracked file for a denylisted name
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
        run: |
          set -euo pipefail
          list="$(mktemp)"
          trap 'rm -f "$list"' EXIT
          printf '%s\n' "$DENYLIST" > "$list"
          python scripts/check_denylist.py --patterns "$list"
