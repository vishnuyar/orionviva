[project]
name = "viva"
version = "0.1.0"
description = "OrionViva — the product: an encrypted, append-only, double-entry ledger that answers questions about your money honestly, with a cited source and a confidence signal on every figure."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Vishnu Yarmaneni" }]
dependencies = [
    "vivacore",          # the shared crown jewels (verify/, models/, claims)
    "merchantcore",      # the merchant knowledge base (normalize, enrich, catalog)
    "cryptography>=42",  # AES-256-GCM + scrypt for encryption at rest (ADR-005)
]

[project.optional-dependencies]
# PyYAML loads the workflow files, so a build definition that cannot be
# parsed fails a test rather than disappearing silently from the build.
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
    # Repository-level synthetic PDF generator smoke tests.
    "reportlab>=4.0",
    "pypdf>=4.0",
]
# Only needed for the live document reader (a real model run). The whole tested
# core runs without these — they render a real PDF's pages and read its text.
reader = ["pypdfium2>=4.28", "Pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["viva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test in this package depends on a repository-level script, and that
# dependency is real and should stay visible. Declaring the repository root on
# the import path makes the module collect however the runner is invoked, so a
# developer typing `pytest` here gets the same answer as the build.
pythonpath = [".."]
# Vaults are minted at a cheap scrypt cost suite-wide (see tests/conftest.py).
# This marker opts a file back out and pays the real, interactive-login-grade
# cost, for the tests whose subject is the vault itself.
markers = ["production_kdf: mint vaults at the production scrypt cost parameters"]

# Prompts are DATA and must ship with the wheel. A packaging slip here is
# invisible in a checkout and fatal in an install: `resolve()` would raise on a
# version that plainly exists in the repo. X1 — the toolchain is a contributor's
# problem, never a user's.
[tool.setuptools.package-data]
"viva" = ["versions.json", "prompts/*.txt", "persona/*/*.json", "persona/*/*.md",
          "knowledge/*.json", "schemas/*.json", "evals/*.json"]
