[project]
name = "merchantcore"
version = "0.1.0"
description = "OrionViva merchant knowledge — a peer to vivacore: deterministic merchant normalization, the multi-attribute merchant record, a batched model enrichment engine, and the merchant→category commons. Holds and shares ONLY impersonal merchant knowledge; the personal ledger never crosses this boundary (T9)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishnu Yarmaneni" }]
dependencies = [
    "vivacore",          # the provider-agnostic model socket + grade schema
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["merchantcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Prompts are DATA and must ship with the wheel. A packaging slip here is
# invisible in a checkout and fatal in an install: `resolve()` would raise on a
# version that plainly exists in the repo. X1 — the toolchain is a contributor's
# problem, never a user's.
[tool.setuptools.package-data]
"merchantcore" = ["versions.json", "prompts/*.txt"]
